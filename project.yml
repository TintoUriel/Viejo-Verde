# Proyecto de Xcode para compilar el .ipa en GitHub Actions (XcodeGen).
# En el iPhone por cable se sigue usando xtool con Package.swift; esto es solo para el camino sin WSL.
name: ViejoVerde
options:
  bundleIdPrefix: com.tinto
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
targets:
  ViejoVerdeCore:
    type: framework
    platform: iOS
    sources:
      - Sources/ViejoVerdeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinto.viejoverde.core
        PRODUCT_NAME: ViejoVerdeCore
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SKIP_INSTALL: YES
  ViejoVerde:
    type: application
    platform: iOS
    sources:
      - Sources/ViejoVerde
      - ci/Assets.xcassets
    dependencies:
      - target: ViejoVerdeCore
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinto.viejoverde
        PRODUCT_NAME: ViejoVerde
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Se mezcla el Info.plist del repo (nombre, permiso de cámara, orientación) con lo que genera Xcode.
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
